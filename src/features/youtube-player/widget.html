<section class="yt-widget">
  <button type="button" class="yt-widget-pill" title="Agrandir le lecteur">
    <span class="yt-live-dot"></span>
    <span class="yt-widget-title"></span>
    <i class="fas fa-up-right-and-down-left-from-center"></i>
  </button>

  <div class="yt-widget-panel">
    <header class="yt-widget-header" title="Déplacer">
      <span class="yt-live-dot"></span>
      <span class="yt-widget-title"></span>
      {{#if isGM}}
      <button type="button" class="yt-widget-icon yt-toggle-library" title="Bibliothèque">
        <i class="fas fa-folder-tree"></i>
      </button>
      {{/if}}
      <button type="button" class="yt-widget-icon yt-collapse" title="Réduire">
        <i class="fas fa-minus"></i>
      </button>
    </header>

    <div class="yt-widget-screen">
      <div class="yt-player-target"></div>
      {{#unless isGM}}
      <div class="yt-player-shield"></div>
      <button type="button" class="yt-join">
        <i class="fas fa-play"></i> Rejoindre la diffusion
      </button>
      {{/unless}}
      <div class="yt-widget-placeholder">
        <i class="fab fa-youtube"></i>
        <span>Choisissez une vidéo dans la bibliothèque pour la diffuser.</span>
      </div>
    </div>

    <footer class="yt-widget-footer">
      {{#if isGM}}
      <button type="button" class="yt-widget-text-btn yt-stop-broadcast" title="Arrêter la diffusion pour tout le monde">
        <i class="fas fa-stop"></i> Arrêter la diffusion
      </button>
      {{else}}
      <label class="yt-volume" title="Volume">
        <i class="fas fa-volume-low"></i>
        <input type="range" min="0" max="100" step="1" value="{{volume}}">
      </label>
      {{/if}}
    </footer>

    {{#if isGM}}
    <div class="yt-widget-library">
      {{> "modules/sodl-companion/src/features/youtube-player/library.html"}}
    </div>
    {{/if}}
  </div>
</section>
