<div class="yt-library">
  <div class="yt-section-header">
    <span>{{localize "SODL.Youtube.Library"}}</span>
    <button type="button" class="yt-widget-icon yt-new-folder-toggle" title="{{localize 'SODL.Youtube.NewFolder'}}">
      <i class="fas fa-folder-plus"></i>
    </button>
  </div>

  <form class="yt-inline-form yt-new-folder">
    <i class="fas fa-folder"></i>
    <input type="text" name="name" placeholder="{{localize 'SODL.Youtube.FolderName'}}" autocomplete="off">
    <button type="submit" class="yt-widget-icon" title="{{localize 'SODL.Youtube.Create'}}"><i class="fas fa-check"></i></button>
    <button type="button" class="yt-widget-icon yt-inline-cancel" title="{{localize 'SODL.Common.Cancel'}}"><i class="fas fa-xmark"></i></button>
  </form>

  {{#each groups}}
  <div class="yt-folder {{#if this.collapsed}}yt-folder-collapsed{{/if}}" data-folder-id="{{this.id}}">
    <div class="yt-folder-header">
      <i class="fas fa-folder yt-folder-icon-closed"></i>
      <i class="fas fa-folder-open yt-folder-icon-open"></i>
      <span class="yt-folder-name">{{this.name}}</span>
      <span class="yt-folder-count">{{this.videos.length}}</span>
      {{#if this.id}}
      <a class="yt-rename" title="{{localize 'SODL.Youtube.RenameFolder'}}"><i class="fas fa-pen"></i></a>
      <a class="yt-remove" title="{{localize 'SODL.Youtube.DeleteFolder'}}"><i class="fas fa-trash"></i></a>
      {{/if}}
    </div>
    <ul class="yt-video-list">
      {{#each this.videos}}
      <li class="yt-video {{#if this.active}}yt-video-active{{/if}}" data-video-id="{{this.id}}" title="{{localize 'SODL.Youtube.VideoHint' title=this.title}}" draggable="true">
        <i class="fas fa-play-circle"></i>
        <span class="yt-video-title">{{this.title}}</span>
        <a class="yt-rename" title="{{localize 'SODL.Youtube.RenameVideo'}}"><i class="fas fa-pen"></i></a>
        <a class="yt-remove" title="{{localize 'SODL.Youtube.DeleteVideo'}}"><i class="fas fa-trash"></i></a>
      </li>
      {{else}}
      <li class="yt-empty">{{localize "SODL.Youtube.EmptyFolder"}}</li>
      {{/each}}
    </ul>
  </div>
  {{else}}
  <p class="yt-empty">{{localize "SODL.Youtube.EmptyLibrary"}}</p>
  {{/each}}
</div>
